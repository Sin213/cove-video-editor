[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cove-video-editor"
version = "2.5.0"
description = "Lightweight offline video editor: multi-clip timeline, unlimited audio tracks, still-image title cards, burn-in subtitles, trim / split / crop / region-delete, multi-format export"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cove" }]
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
cove-video-editor = "cove_video_editor.__main__:main"
cove-video-editor-mcp = "cove_video_editor.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cove_video_editor = ["assets/*.png", "assets/*.ico"]
